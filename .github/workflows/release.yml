name: release

# 推 tag（v0.1.0 这种）→ 构建发布包并挂到 Release；
# 手动触发 → 只构建，产物走 Actions artifact，不动 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 上传 Release 资产需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt capstone pyinstaller

      - name: 构建发布包
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          ./tools/build_release.ps1 -Version ${{ github.ref_name }} -PythonExe $py

      - name: 临时构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: th06nc-autododge-win64
          path: dist/**/*.zip

      - name: 挂到 Release（推 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/SHA256SUMS.txt
          generate_release_notes: true
